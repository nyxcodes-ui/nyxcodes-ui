name: Update freeCodeCamp Stats
on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

jobs:
  update-readme:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4.2.2

      - name: Fetch freeCodeCamp Stats
        run: |
          # Fetch public data
          USER_DATA=$(curl -s https://freecodecamp.org)
          
          # Extract points safely using jq
          POINTS=$(echo "$USER_DATA" | jq -r '.entities.user["nyxcodes-ui"].points // .entities.user[].points' 2>/dev/null)
          
          # Fallback if points are missing or profile is private
          if [ -z "$POINTS" ] || [ "$POINTS" = "null" ]; then
            echo "⚠️ Profile might be private! Setting score to 0."
            POINTS="0 (Set fCC Profile to Public)"
          fi
          
          echo "💡 **Total freeCodeCamp Points:** $POINTS 🏆" > fcc_text.txt

      - name: Inject Stats into README
        run: |
          sed -i '/<!-- START_SECTION:fcc_stats -->/,/<!-- END_SECTION:fcc_stats -->/{//!d}' README.md
          sed -i '/<!-- START_SECTION:fcc_stats -->/r fcc_text.txt' README.md

      - name: Commit changes
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add README.md
          git commit -m "Update freeCodeCamp stats" || exit 0
          git 
          push
