name: Update freeCodeCamp Stats
on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

# This forces GitHub to give the script write access, bypassing the browser settings menu
permissions:
  contents: write

jobs:
  update-readme:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4

      - name: Fetch freeCodeCamp Stats
        run: |
          # Grabs your profile data securely
          USER_DATA=$(curl -s https://freecodecamp.org)
          
          # Extracts points cleanly and falls back safely to 0 if the API lags
          POINTS=$(echo "$USER_DATA" | jq -r 'try .entities.user[].points catch "0"')
          
          if [ -z "$POINTS" ] || [ "$POINTS" = "null" ]; then
            POINTS="0"
          fi
          
          echo "💡 **Total freeCodeCamp Points:** $POINTS 🏆" > fcc_text.txt

      - name: Inject Stats into README
        run: |
          sed -i '/<!-- START_SECTION:fcc_stats -->/,/<!-- END_SECTION:fcc_stats -->/{//!d}' README.md
          sed -i '/<!-- START_SECTION:fcc_stats -->/r fcc_text.txt' README.md

      - name: Commit changes
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add README.md
          git commit -m "Update freeCodeCamp stats" || exit 0
          git push
